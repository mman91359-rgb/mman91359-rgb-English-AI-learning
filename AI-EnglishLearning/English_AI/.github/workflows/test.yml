name: 自动化测试门禁

# 触发：推送到 main / 发 PR 时自动跑测试，作为合入门禁
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============ 单元测试（无需 Docker，最快门禁） ============
  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 运行单元测试（排除 integration 标签）
        run: mvn -B test
        # 默认 surefire 已排除 @Tag("integration")，此处只跑纯单元测试

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  # ============ 集成测试（需 Docker，跑真实 MySQL/RabbitMQ） ============
  integration-test:
    name: 集成测试（Testcontainers）
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 运行集成测试（仅 integration 标签）
        run: mvn -B test -Dgroups=integration
        env:
          # Testcontainers 自动拉起 MySQL/RabbitMQ，无需额外配置
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: 上传集成测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  # ============ 冒烟测试（可选：需后端服务已部署，默认不自动跑） ============
  # 说明：冒烟测试需要真实运行的服务环境，通常在测试环境部署后手动触发。
  # 如需接入，可取消注释并在环境变量填入测试环境地址。
