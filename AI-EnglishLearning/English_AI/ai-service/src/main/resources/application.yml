server:
  port: 8084

spring:
  application:
    name: ai-service

# 阿里云百炼 API 配置（MaaS - OpenAI 兼容接口）
dashscope:
  api-key: ${AI_SERVICE_API_KEY:}
  base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  model: ${DASHSCOPE_MODEL:qwen-plus}
  max-tokens: ${DASHSCOPE_MAX_TOKENS:1500}
  temperature: ${DASHSCOPE_TEMPERATURE:0.7}
