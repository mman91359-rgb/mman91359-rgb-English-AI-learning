server:
  port: 8082

spring:
  application:
    name: exercise-service

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/exercise_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}

  # Flyway 数据库版本管理：启动时校验；生产可按需把 FLYWAY_BASELINE_ON_MIGRATE 设为 false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1.0.0
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    encoding: UTF-8
    table: flyway_schema_history
    fail-on-missing-locations: true

  # RabbitMQ 消息队列（本地无RabbitMQ时设为enabled: false）
  rabbitmq:
    enabled: false
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}

mybatis-plus:
  type-aliases-package: com.english.ai.exercise.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# 服务间调用地址（生产用环境变量覆盖为 docker 服务名）
service:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  learning-engine:
    url: ${LEARNING_SERVICE_URL:http://localhost:8083}
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8084}

# 内部接口令牌：调用 user-service 的 /internal/** 时携带
app:
  internal:
    token: ${INTERNAL_TOKEN:local-dev-internal-token}
