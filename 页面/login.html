<body class="bg-background text-on-background min-h-screen flex antialiased">
<!-- SideNavBar -->
<aside class="hidden md:flex flex-col h-screen fixed left-0 top-0 w-sidebar-width bg-surface border-r border-outline-variant py-8 px-4 z-50">
<div class="flex items-center gap-3 mb-8 px-4">

<nav class="flex-1 flex flex-col gap-2">

</a>
<a class="flex items-center gap-4 px-4 py-3 rounded-xl text-on-surface-variant hover:bg-primary-container/10 hover:text-primary transition-colors" href="#">

</a>
</nav>

<!-- Main Content Canvas -->
<main class="flex-1 w-full md:ml-sidebar-width flex flex-col min-h-screen relative"><header class="h-20 sticky top-0 z-40 bg-background/80 backdrop-blur-md flex items-center justify-between px-gutter w-full max-w-container-max mx-auto"><div class="flex items-center gap-4"><div class="md:hidden"><span class="material-symbols-outlined text-on-surface text-2xl cursor-pointer">menu</span></div></div><div class="flex items-center gap-4">
<button class="p-2 text-on-surface-variant hover:bg-surface-container-high/50 rounded-full transition-all">
<span class="material-symbols-outlined">light_mode</span>
</button>
<button class="p-2 text-on-surface-variant hover:bg-surface-container-high/50 rounded-full transition-all">
<span class="material-symbols-outlined">language</span>
</button>

</div></header>
<div class="flex-1 px-gutter py-8 w-full max-w-container-max mx-auto space-y-8 flex flex-col justify-center">
<div class="grid grid-cols-1 md:grid-cols-12 gap-gutter">
<div class="col-span-1 md:col-span-6 md:col-start-4 bg-surface rounded-[24px] p-8 sm:p-10 shadow-soft-glow relative overflow-hidden">
<!-- Logo & Header -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container/10 mb-4">
<span class="material-symbols-outlined text-primary text-3xl fill" data-icon="auto_stories" data-weight="fill">auto_stories</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-2">Recall-睿考</h1>
<p class="font-body-md text-body-md text-on-surface-variant">开启你的 AI 英语提分之旅</p>
</div>
<!-- Login Form -->
<form class="space-y-5" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Username -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary group-focus-within:text-primary transition-colors" data-icon="person">person</span>
</div>
<input class="w-full py-3.5 pl-12 pr-4 bg-background border border-outline-variant rounded-[16px] text-on-surface placeholder-outline font-body-md text-body-md focus:bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" id="username" placeholder="用户名 / 手机号" required="" type="text">
</div>
<!-- Password -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="w-full py-3.5 pl-12 pr-12 bg-background border border-outline-variant rounded-[16px] text-on-surface placeholder-outline font-body-md text-body-md focus:bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" id="password" placeholder="密码" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-secondary hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off" id="visibilityIcon">visibility_off</span>
</button>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full py-3.5 px-4 bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-label-lg text-label-lg rounded-full shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2 active:scale-95" id="submitBtn" type="submit">
<span class="" id="btnText">登 录</span>
<span class="material-symbols-outlined hidden animate-spin" data-icon="progress_activity" id="spinnerIcon">progress_activity</span>
</button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
          还没有账号？
          <a class="text-primary font-bold hover:underline underline-offset-4 transition-all" href="#">立即注册</a>

</main>
<script>
    function togglePassword() {
      const pwdInput = document.getElementById('password');
      const icon = document.getElementById('visibilityIcon');
      
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.textContent = 'visibility';
        icon.setAttribute('data-icon', 'visibility');
      } else {
        pwdInput.type = 'password';
        icon.textContent = 'visibility_off';
        icon.setAttribute('data-icon', 'visibility_off');
      }
    }

    function handleLogin() {
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('spinnerIcon');
      
      // Simulate loading state
      btn.disabled = true;
      btn.classList.add('opacity-80', 'cursor-not-allowed');
      btnText.textContent = '登录中...';
      spinner.classList.remove('hidden');

      // Simulate API call
      setTimeout(() => {
        // Reset state
        btn.disabled = false;
        btn.classList.remove('opacity-80', 'cursor-not-allowed');
        btnText.textContent = '登 录';
        spinner.classList.add('hidden');
        
        // Mock routing logic based on 'isAssessed'
        const isAssessed = Math.random() > 0.5;
        console.log('Login successful. isAssessed:', isAssessed);
        // window.location.href = isAssessed ? '/dashboard' : '/onboarding';
      }, 1500);
    }
  </script>
