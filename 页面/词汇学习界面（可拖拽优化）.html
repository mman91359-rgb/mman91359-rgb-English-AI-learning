<script>
    const wordBank = document.getElementById('word-bank');
    const selectedWordsArea = document.getElementById('selected-words');
    const answerArea = document.getElementById('answer-area');
    const confirmBtn = document.getElementById('confirm-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const dropIndicator = document.getElementById('drop-indicator');

    let draggedElement = null;
    let correctCount = 1;
    const totalCount = 20;

    // Helper to update button state
    function updateConfirmState() {
        // Exclude the indicator from the count
        const hasWords = Array.from(selectedWordsArea.children).filter(el => el.classList.contains('word-chip')).length > 0;
        if (hasWords) {
            confirmBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant');
            confirmBtn.classList.add('bg-primary', 'text-on-primary', 'shadow-lg', 'shadow-primary/20');
        } else {
            confirmBtn.classList.remove('bg-primary', 'text-on-primary', 'shadow-lg', 'shadow-primary/20');
            confirmBtn.classList.add('bg-surface-variant', 'text-on-surface-variant');
        }
    }

    // Helper to style a chip based on where it is
    function styleChip(chip, inAnswer) {
        if (inAnswer) {
            chip.className = 'word-chip bg-primary text-white px-4 py-2 rounded-lg font-body-md shadow-sm border border-primary transition-all';
        } else {
            chip.className = 'word-chip bg-surface-container-lowest text-on-surface px-5 py-3 rounded-xl font-body-lg text-body-lg soft-shadow border border-outline-variant/20 hover:border-secondary transition-all';
        }
    }

    // Calculate nearest insertion point
    function getInsertionPoint(container, x, y) {
        const chips = Array.from(container.querySelectorAll('.word-chip:not(.dragging)'));
        
        return chips.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            // Determine if mouse is closer to the beginning or end of this chip
            const offset = x - (box.left + box.width / 2);
            
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // Drag events
    document.addEventListener('dragstart', (e) => {
        if (e.target.classList.contains('word-chip')) {
            draggedElement = e.target;
            e.target.classList.add('dragging');
            e.dataTransfer.setData('text/plain', e.target.dataset.word);
            e.dataTransfer.effectAllowed = 'move';
        }
    });

    document.addEventListener('dragend', (e) => {
        if (e.target.classList.contains('word-chip')) {
            e.target.classList.remove('dragging');
            draggedElement = null;
            dropIndicator.style.display = 'none';
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        }
    });

    // Handle Answer Area
    answerArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        answerArea.classList.add('drag-over');
        
        const afterElement = getInsertionPoint(selectedWordsArea, e.clientX, e.clientY);
        
        dropIndicator.style.display = 'block';
        if (afterElement == null) {
            selectedWordsArea.appendChild(dropIndicator);
        } else {
            selectedWordsArea.insertBefore(dropIndicator, afterElement);
        }
    });

    answerArea.addEventListener('dragleave', (e) => {
        // Only hide if we actually left the container
        if (!answerArea.contains(e.relatedTarget)) {
            answerArea.classList.remove('drag-over');
            dropIndicator.style.display = 'none';
        }
    });

    answerArea.addEventListener('drop', (e) => {
        e.preventDefault();
        answerArea.classList.remove('drag-over');
        dropIndicator.style.display = 'none';
        
        if (draggedElement) {
            styleChip(draggedElement, true);
            const afterElement = getInsertionPoint(selectedWordsArea, e.clientX, e.clientY);
            
            if (afterElement == null) {
                selectedWordsArea.appendChild(draggedElement);
            } else {
                selectedWordsArea.insertBefore(draggedElement, afterElement);
            }
            updateConfirmState();
        }
    });

    // Word Bank Logic (simple append)
    wordBank.addEventListener('dragover', (e) => {
        e.preventDefault();
        wordBank.classList.add('drag-over');
    });

    wordBank.addEventListener('dragleave', () => {
        wordBank.classList.remove('drag-over');
    });

    wordBank.addEventListener('drop', (e) => {
        e.preventDefault();
        wordBank.classList.remove('drag-over');
        if (draggedElement) {
            styleChip(draggedElement, false);
            wordBank.appendChild(draggedElement);
            updateConfirmState();
        }
    });

    // Click-to-move support
    document.addEventListener('click', (e) => {
        const chip = e.target.closest('.word-chip');
        if (!chip) return;

        if (chip.parentElement === wordBank) {
            styleChip(chip, true);
            // On click, always append to end
            selectedWordsArea.appendChild(chip);
        } else {
            styleChip(chip, false);
            wordBank.appendChild(chip);
        }
        updateConfirmState();
    });

    // Confirmation logic
    confirmBtn.onclick = () => {
        const currentChips = Array.from(selectedWordsArea.children).filter(el => el.classList.contains('word-chip'));
        if (currentChips.length > 0) {
            correctCount++;
            if (correctCount > totalCount) correctCount = totalCount;
            const progress = (correctCount / totalCount) * 100;
            progressBar.style.width = `${progress}%`;
            progressText.textContent = `${correctCount}/${totalCount}`;
            
            // Clear and reset chips
            currentChips.forEach(chip => {
                styleChip(chip, false);
                wordBank.appendChild(chip);
            });
            updateConfirmState();
        }
    };
</script>
