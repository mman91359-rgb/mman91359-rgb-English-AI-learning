<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Recall-睿考 - 注册</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "surface-variant": "#2d3449",
                        "on-tertiary-fixed-variant": "#004c69",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",

                        "secondary-fixed": "#ffdcc5",
                        "on-primary": "#332664",

                        "tertiary-fixed": "#c4e7ff",

                        "surface-container-highest": "#2d3449",

                        "tertiary": "#b2e1ff",
                        "on-secondary-fixed-variant": "#713700",
                        "background": "#0b1326",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#514483",
                        "primary-container": "#c4b5fd",
                        "inverse-primary": "#625595",
                        "surface-dim": "#0b1326",

                    "spacing": {
                        "gutter": "24px",
                        "lg": "48px",
                        "sm": "12px",
                        "margin-desktop": "40px",
                        "base": "8px",
                        "margin-mobile": "16px",
                        "xl": "80px",
                        "md": "24px",
                        "xs": "4px",
                        "sidebar-width": "280px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "headline-xl": ["Inter"],
                        "body-lg": ["Inter"],

                    },
                    "boxShadow": {
                        'soft-glow': '0 4px 24px rgba(0, 0, 0, 0.4)',
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex" id="app">
<!-- SideNavBar -->
<aside class="hidden md:flex flex-col h-screen fixed left-0 top-0 w-sidebar-width bg-surface-container border-r border-outline-variant py-8 px-4 z-50">
<div class="flex items-center gap-3 mb-8 px-4">
<div class="w-10 h-10 bg-primary-container rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container text-3xl">school</span>
</div>
<span class="text-headline-md font-bold text-primary">Recall-睿考</span>
</div>
<nav class="flex-1 flex flex-col gap-2">
<a class="flex items-center gap-4 px-4 py-3 rounded-xl text-on-surface-variant hover:bg-primary-container/20 hover:text-primary transition-colors" href="/login">
<span class="material-symbols-outlined">login</span>
<span class="font-label-lg text-label-lg">登录</span>
</a>
<a class="flex items-center gap-4 px-4 py-3 rounded-xl bg-primary-container/20 text-primary border-l-2 border-primary font-bold transition-colors" href="#">
<span class="material-symbols-outlined fill">person_add</span>
<span class="font-label-lg text-label-lg">注册</span>
</a>
</nav>
</aside>
<!-- Main Content Area -->
<main class="flex-1 w-full md:ml-sidebar-width flex flex-col min-h-screen relative">
<!-- TopAppBar -->
<header class="h-20 sticky top-0 z-40 bg-background/80 backdrop-blur-md flex items-center justify-between px-gutter w-full max-w-[1200px] mx-auto">
<div class="flex items-center gap-4">
<div class="md:hidden">
<span class="material-symbols-outlined text-on-surface text-2xl cursor-pointer">menu</span>
</div>
</div>
<div class="flex items-center gap-4">
<button class="p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-all">
<span class="material-symbols-outlined">dark_mode</span>
</button>
<button class="p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-all">
<span class="material-symbols-outlined">language</span>
</button>
</div>
</header>
<!-- Main Dashboard Content -->
<div class="flex-1 px-gutter py-8 w-full max-w-[1200px] mx-auto space-y-8 flex flex-col justify-center">
<div class="grid grid-cols-1 md:grid-cols-12 gap-gutter">
<!-- Registration Card -->
<div class="col-span-1 md:col-span-6 md:col-start-4 bg-surface-container-high rounded-[24px] p-8 shadow-soft-glow relative overflow-hidden">
<!-- Decorative background element -->
<div class="absolute -right-20 -top-20 w-64 h-64 bg-primary-container/10 rounded-full blur-3xl"></div>
<div class="relative z-10">
<!-- Logo & Header Section -->
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 bg-primary-container/20 rounded-xl flex items-center justify-center mb-4">
<svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2 font-bold">Recall-睿考</h2>
<p class="font-body-md text-body-md text-on-surface-variant">开启你的 AI 英语提分之旅</p>
</div>
<!-- Form -->
<form class="space-y-4">
<!-- Username Input -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="w-full py-3.5 pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface placeholder-outline focus:ring-2 focus:ring-primary focus:border-primary transition-colors outline-none" placeholder="用户名" required="" type="text"/>
</div>
<!-- Password Input -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full py-3.5 pl-12 pr-12 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface placeholder-outline focus:ring-2 focus:ring-primary focus:border-primary transition-colors outline-none" placeholder="密码" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<!-- Confirm Password Input -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">shield</span>
</div>
<input class="w-full py-3.5 pl-12 pr-12 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface placeholder-outline focus:ring-2 focus:ring-primary focus:border-primary transition-colors outline-none" placeholder="确认密码" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<!-- Submit Button -->
<button class="w-full py-3.5 mt-4 bg-primary-container text-on-primary-container rounded-full font-label-lg text-label-lg hover:bg-primary-container/90 transition-colors disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center shadow-sm font-bold" type="submit">
<span class="">注 册</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center">
<a class="font-label-lg text-label-lg text-primary hover:text-primary-fixed transition-colors" href="/login">已有账号？立即登录</a>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full bg-surface-container border-t border-outline-variant/30 flex justify-around items-center h-16 z-50 pb-safe">
<a class="flex flex-col items-center gap-1 text-on-surface-variant" href="/login">
<span class="material-symbols-outlined">login</span>
<span class="font-label-md text-[10px]">登录</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined fill">person_add</span>
<span class="font-label-md text-[10px] font-bold">注册</span>
</a>
</nav>
</body></html>
